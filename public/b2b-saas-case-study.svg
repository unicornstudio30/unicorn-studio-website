<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="B2B SaaS content engine case study">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset=".55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="glow1" cx=".15" cy=".15" r=".65">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".5"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".88" cy=".9" r=".55">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset=".5" stop-color="#38bdf8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect width="1200" height="800" fill="url(#glow1)"/>
  <rect width="1200" height="800" fill="url(#glow2)"/>

  <!-- Eyebrow -->
  <g transform="translate(80,72)">
    <rect width="260" height="34" rx="17" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".2"/>
    <circle cx="20" cy="17" r="4" fill="#22d3ee"/>
    <text x="36" y="22" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#bae6fd">CASE · AI MARKETING SYSTEM</text>
  </g>

  <!-- Headline — full width, fits before icons -->
  <g transform="translate(80,140)">
    <text font-family="Inter, system-ui, sans-serif" fill="#ffffff">
      <tspan x="0" y="60" font-size="58" font-weight="800" letter-spacing="-1.5">A B2B SaaS founder reclaimed</tspan>
      <tspan x="0" y="128" font-size="58" font-weight="800" letter-spacing="-1.5" fill="url(#accent)">12 hours a week</tspan>
      <tspan x="0" y="196" font-size="58" font-weight="800" letter-spacing="-1.5">by rebuilding the content engine.</tspan>
    </text>
  </g>

  <!-- Divider line -->
  <line x1="80" y1="400" x2="1120" y2="400" stroke="url(#line)" stroke-width="2"/>

  <!-- Middle row: source node + connectors + channel icons -->
  <!-- Left label: "ONE INPUT" beside source node -->
  <g transform="translate(80,440)">
    <text font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="3" fill="#7dd3fc" y="14">ONE INPUT</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="-.4" fill="#ffffff" y="50">Founder writes once</text>
    <text font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" y="78">or speaks into a voice memo</text>
  </g>

  <!-- Source node centred -->
  <g transform="translate(540,460)">
    <circle cx="40" cy="40" r="48" fill="url(#accent)" opacity=".25" filter="url(#soft)"/>
    <circle cx="40" cy="40" r="34" fill="#0f172a" stroke="url(#accent)" stroke-width="2"/>
    <text x="40" y="46" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" letter-spacing=".5">AI</text>
  </g>

  <!-- Right label: "MANY OUTPUTS" -->
  <g transform="translate(680,440)">
    <text font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="3" fill="#bae6fd" y="14" text-anchor="end" x="440">FOUR CHANNELS</text>
  </g>

  <!-- Connectors from source to channels -->
  <g stroke="url(#accent)" stroke-width="1.5" fill="none" opacity=".55">
    <path d="M 620 500 C 700 500 720 458 800 458" stroke-dasharray="5 5"/>
    <path d="M 620 500 C 700 500 720 488 800 488" stroke-dasharray="5 5"/>
    <path d="M 620 500 C 700 500 720 518 800 518" stroke-dasharray="5 5"/>
    <path d="M 620 500 C 700 500 720 548 800 548" stroke-dasharray="5 5"/>
  </g>

  <!-- Channel chips (row) -->
  <g transform="translate(800,440)">
    <!-- LinkedIn -->
    <g transform="translate(0,0)">
      <rect width="76" height="36" rx="18" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".2"/>
      <text x="38" y="23" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#7dd3fc">LinkedIn</text>
    </g>
    <!-- X -->
    <g transform="translate(88,0)">
      <rect width="76" height="36" rx="18" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".2"/>
      <text x="38" y="23" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">X</text>
    </g>
    <!-- Reddit -->
    <g transform="translate(0,52)">
      <rect width="76" height="36" rx="18" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".2"/>
      <text x="38" y="23" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#a78bfa">Reddit</text>
    </g>
    <!-- Blog -->
    <g transform="translate(88,52)">
      <rect width="76" height="36" rx="18" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".2"/>
      <text x="38" y="23" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fde68a">Blog</text>
    </g>
  </g>

  <!-- Metric cards (3 across at bottom) -->
  <g transform="translate(80,610)">
    <g>
      <rect width="320" height="150" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity=".15"/>
      <text x="24" y="42" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#7dd3fc">FOUNDER TIME</text>
      <text x="24" y="92" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-1">14h → 2h</text>
      <text x="24" y="124" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#cbd5e1">per week on content</text>
    </g>
    <g transform="translate(340,0)">
      <rect width="320" height="150" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity=".15"/>
      <text x="24" y="42" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#7dd3fc">OUTPUT</text>
      <text x="24" y="92" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-1">3×</text>
      <text x="24" y="124" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#cbd5e1">across all channels</text>
    </g>
    <g transform="translate(680,0)">
      <rect width="320" height="150" rx="20" fill="url(#card)" stroke="#ffffff" stroke-opacity=".15"/>
      <text x="24" y="42" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#7dd3fc">TIMELINE</text>
      <text x="24" y="92" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="800" fill="#ffffff" letter-spacing="-1">4 wk</text>
      <text x="24" y="124" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#cbd5e1">from kickoff to live</text>
    </g>
  </g>
</svg>
