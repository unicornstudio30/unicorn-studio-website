name: Deploy to Hostinger

# Manual-only — Vercel handles staging on every push to main; this workflow
# pushes the latest main to Hostinger production once the user has reviewed
# the Vercel preview and clicks "Run workflow" in the GitHub Actions UI.
#
# Strategy: build the static site, then publish the built `out/` to a
# dedicated `production` branch. Hostinger's Git integration is configured
# to pull `production` into public_html — so a successful workflow run
# (plus, if needed, a "Pull" click in hPanel) updates the live site.
on:
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

permissions:
  contents: write   # needed to push to the production branch

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Inspect build output
        run: |
          echo "Contents of out/:"
          ls -la out/ || echo "out/ does not exist!"
          echo ""
          echo "Total files: $(find out -type f 2>/dev/null | wc -l)"
          echo ""
          echo "Top-level entries:"
          find out -maxdepth 2 -type f 2>/dev/null | head -20

      - name: Generate .htaccess (clean URLs + cache + force HTTPS + api-catalog)
        run: |
          cat > out/.htaccess <<'HTACCESS'
          # Hostinger shared hosting — Apache rewrite rules
          Options -MultiViews
          RewriteEngine On

          # Serve /foo as /foo/index.html (Next.js static export)
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule ^([^.]+[^/])$ $1/ [L,R=301]

          # Content negotiation: when the client opts in via either
          # Accept: text/markdown OR ?format=md, and an index.md twin
          # exists for the requested directory, serve that instead of
          # index.html. Works for the homepage (/) too because we anchor
          # off REQUEST_URI instead of capturing the path with a regex
          # that requires at least one leading character.
          RewriteCond %{HTTP_ACCEPT} text/markdown [OR]
          RewriteCond %{QUERY_STRING} (^|&)format=md(&|$)
          RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}index.md -f
          RewriteRule ^ %{REQUEST_URI}index.md [L,T=text/markdown,QSD]

          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteRule ^(.+)/$ $1/index.html [L]

          # Always serve .md files with the correct Content-Type, so that
          # fetching /path/index.md directly also works as expected.
          AddType text/markdown .md

          # Long cache for hashed assets
          <FilesMatch "\.(js|css|woff2|woff|ttf|otf|svg|png|jpg|jpeg|webp|avif|ico)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
          </FilesMatch>

          # RFC 9727 — Serve /.well-known/api-catalog as application/linkset+json
          <Files "api-catalog">
            ForceType application/linkset+json
            Header set Cache-Control "public, max-age=86400"
          </Files>

          # draft-ietf-httpapi-signature-directory — JWKS-style key directory
          <Files "http-message-signatures-directory">
            ForceType application/http-message-signatures-directory+json
            Header set Cache-Control "public, max-age=86400"
          </Files>

          # OpenAPI 3.1 description served at /openapi.yaml (linked from the
          # api-catalog). AddType wins where ForceType-inside-Files loses to
          # extension-based MIME matching on LiteSpeed.
          AddType "application/vnd.oai.openapi+yaml;version=3.1" .yaml
          <Files "openapi.yaml">
            Header set Cache-Control "public, max-age=86400"
          </Files>

          # RFC 9727 — Advertise the catalog via a Link header on every HTML
          # response (skipped for assets to avoid bloat). Single-quoted outer
          # so LiteSpeed (Hostinger's Apache variant) preserves inner quotes
          # cleanly instead of leaking backslashes.
          <FilesMatch "\.html$">
            Header append Link '</.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json"'
          </FilesMatch>

          # Force HTTPS
          RewriteCond %{HTTPS} off
          RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
          HTACCESS

      - name: Publish out/ to production branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: production
          force_orphan: true              # one commit per deploy, no history bloat
          commit_message: "deploy: ${{ github.sha }}"
          user_name: "github-actions[bot]"
          user_email: "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Hostinger deploy — production branch updated"
            echo ""
            echo "- **Source commit:** \`${{ github.sha }}\`"
            echo "- **Published to branch:** \`production\` (force-orphaned)"
            echo "- **Next step:** Hostinger pulls \`production\` on its schedule (or click 'Pull' in hPanel → Git → unicornstudio.io)."
            echo "- **Verify:** https://unicornstudio.io"
          } >> "$GITHUB_STEP_SUMMARY"
